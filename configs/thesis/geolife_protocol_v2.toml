schema_version = 2

[dataset]
version = "Geolife Trajectories 1.3.zip (Microsoft Download Center version 1.2.2)"
source_url = "https://www.microsoft.com/en-us/download/details.aspx?id=52367"
retrieved_on = "2026-08-04"
license_text = "The official download page displays no dataset-specific license text; this provenance record preserves that absence and the page-linked Microsoft Terms of Use."
license_sha256 = "a3215b27a5cdce2609a3ec1a28acb36fcaab119853600019de8b16d45947f474"

[selection]
accepted_modes = ["walk", "bike"]
slot_seconds = 1.0
minimum_segment_samples = 50
max_segments_per_participant_mode = 1

# Participants are fixed before archive inspection by the formal workflow.
# The builder fails closed if any declared participant has no eligible segment.
[splits]
train = ["010", "020", "021"]
calibration = ["052", "053", "056"]
final = ["058", "059", "060"]

[placement]
area_size_m = 800.0
translation_m = [400.0, 400.0]
rotation_deg = 0.0

[[final_groups]]
group_id = "geolife-final-composite-1"
participants = ["058", "059", "060"]
