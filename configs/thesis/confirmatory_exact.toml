run_id = "confirmatory-exact"
seed_start = 1000
seed_count = 50
methods = ["full", "exact"]

[scenario]
num_users = 5
num_slots = 10
num_uavs = 2
num_clusters = 3
n_subcarriers = 2
fixed_cluster_centers = true
random_burst = true
user_mobility = true

[evaluation]
gamma_sic_min = 1.0
sic_residual = 0.02
allocation_policy = "deadline"
cross_interference_scale = 1.0

[trace]
csi_error_std = 0.0

[search]
max_iterations = 50
