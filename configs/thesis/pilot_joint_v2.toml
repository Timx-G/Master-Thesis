run_id = "pilot-joint-v2"
event_log_level = "summary"
seed_start = 1000
seed_count = 100
methods = ["iea_dd", "exchange_edf"]

[scenario]
num_users = 45
num_slots = 100
num_uavs = 3
num_clusters = 3
n_subcarriers = 3
f_per_uav = 4e9
fixed_cluster_centers = true
random_burst = false
user_mobility = true

[scenario.task]
arrival_mode = "periodic"
period_choices = [2, 2, 3]
period_jitter_slots = 0
