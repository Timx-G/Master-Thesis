comp_min = 800.0
comp_max = 1500.0
t_min = 0.6
t_max = 1.0
result_ratio = 0.0

[scenario.uav]
dt = 1.0

[evaluation]
gamma_sic_min = 1.0
sic_residual = 0.02
allocation_policy = "deadline"
cross_interference_scale = 1.0

[trace]
csi_error_std = 0.0

[search]
max_iterations = 50
multistart_workers = 3

