schema_version = 2
formal_family = "resource"
run_id = "confirmatory-resource-fixed-v2"
seed_start = 22000
seed_count = 200
methods = ["fixed_radio_dd", "fixed_radio_edf", "fixed_radio_dd_radio_neutral", "fixed_radio_edf_radio_neutral", "fixed_radio_dd_deadline_generated", "fixed_radio_edf_deadline_generated", "exact_admission"]
sample_size_policy = "power_selected"

[scenario]
num_users = 45
num_slots = 100
num_uavs = 3
num_clusters = 3
n_subcarriers = 3
f_per_uav = 4e9
fixed_cluster_centers = true
random_burst = false
user_mobility = true

[scenario.task]
arrival_mode = "periodic"
period_choices = [2, 2, 3]
period_jitter_slots = 0
data_min = 0.8e6
data_max = 3.0e6
comp_min = 800.0
comp_max = 1500.0
t_min = 0.6
t_max = 1.0
result_ratio = 0.0

[scenario.uav]
dt = 1.0

[evaluation]
gamma_sic_min = 1.0
sic_residual = 0.02
allocation_policy = "deadline"
cross_interference_scale = 1.0

[trace]
csi_error_std = 0.0

[search]
max_iterations = 50
multistart_workers = 3

[[cases]]
case_id = "dd_generated"
role = "primary"
generator = "dd_generated"

[[cases]]
case_id = "radio_neutral"
role = "supporting"
generator = "radio_neutral"

[[cases]]
case_id = "deadline_first_generated"
role = "supporting"
generator = "deadline_first_generated"
