# Non-canonical v2 protocol: heavy workload and heterogeneous deadlines.
run_id = "confirmatory-resource-strong"
event_log_level = "summary"
seed_start = 12000
seed_count = 200
# Each resource policy is embedded in every IEA-CAP candidate evaluation and
# in the final evaluation; all methods reuse the same exogenous trace.
methods = [
    "full_fixed_half",
    "full_crossing",
    "full_edf_min_cpu",
    "full_min_slack_min_cpu",
    "full",
    "full_exact_oracle",
]

[scenario]
num_users = 20
num_slots = 100
num_uavs = 2
num_clusters = 3
n_subcarriers = 3
f_per_uav = 4e9
fixed_cluster_centers = true
random_burst = true
user_mobility = true

[scenario.task]
data_min = 0.8e6
data_max = 3.0e6
comp_min = 800.0
comp_max = 1500.0
t_min = 0.6
t_max = 1.0
result_ratio = 0.0

[scenario.uav]
dt = 1.0

[evaluation]
gamma_sic_min = 1.0
sic_residual = 0.02
allocation_policy = "deadline"
cross_interference_scale = 1.0

[trace]
csi_error_std = 0.0

[search]
max_iterations = 50
multistart_workers = 3
